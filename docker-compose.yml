version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: campus_db
    environment:
      MYSQL_ROOT_PASSWORD: rjxy123
      MYSQL_DATABASE: campus_activity
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prjxy123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  # SpringBoot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://campus_db:3306/campus_activity?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rjxy123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - campus_network
    restart: on-failure
    volumes:
      - maven_cache:/root/.m2

  # Vue Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - campus_network

volumes:
  mysql_data:
  maven_cache:

networks:
  campus_network:
    driver: bridge
